experiment:
  id: exp1_3_resnet18_cifar10_1
  name: resnet18_ee_homogeneous_3nodes_cifar10_1
  description: Early-exit ResNet-18 inference distributed across 3 homogeneous worker nodes with layer0+layer1 on worker1, layer2 on worker2, and layer3 on worker3 on CIFAR-10.1.

config_refs:
  dataset: configs/datasets/cifar10_1.yaml
  model: configs/models/resnet18_ee_entropy_cifar10.yaml
  system: configs/systems/homogeneous_3workers.yaml

runtime:
  batch_size: 1
  warmup_samples: 20
  save_per_sample_metrics: true
  save_predictions: false

output:
  dir: ./results/exp1_single_model/03_homogeneous_3workers_resnet18_ee_cifar10_1/run_001
