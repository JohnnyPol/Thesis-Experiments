experiment:
  id: exp2
  name: homogeneous_multi_model_distributed_ee
  description: Multi-model early-exit ResNet-18 inference on a homogeneous cluster, with N-1 logical model instances mapped across N worker stages.

config_refs:
  dataset: configs/datasets/cifar10.yaml
  model: configs/models/resnet18_ee_entropy.yaml
  system: configs/systems/homogeneous_3workers.yaml

runtime:
  batch_size: 1
  warmup_samples: 20
  model_instance_count: auto
  concurrency: 2
  max_samples_per_model: 1000
  save_per_sample_metrics: true
  save_predictions: false

output:
  dir: ./results/exp2_multi_model/01_homogeneous_3workers_2models/run_001
