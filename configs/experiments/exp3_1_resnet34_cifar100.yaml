experiment:
  id: exp3_1_resnet34_cifar100
  name: resnet34_memory_aware_multi_model_placement_cifar100
  description: Two early-exit ResNet-34 model instances with first partitions split and later partitions consolidated on worker3 on CIFAR-100.

config_refs:
  dataset: configs/datasets/cifar100.yaml
  model: configs/models/resnet34_ee_entropy_cifar100.yaml
  system: configs/systems/homogeneous_3workers.yaml

runtime:
  batch_size: 1
  warmup_samples: 20
  model_instance_count: 2
  concurrency: 2
  max_samples_per_model: null
  save_per_sample_metrics: true
  save_predictions: false
  placement_strategy: explicit_first_partition_split

placement:
  spare_worker_id: worker3
  rationale: Most early-exit traffic exits from the first partition, so each model's first partition is placed on a separate worker while worker3 stores the lower-traffic later partitions.
  assignments:
    worker1:
      - model_instance_id: model_0
        partition_id: 0
    worker2:
      - model_instance_id: model_1
        partition_id: 0
    worker3:
      - model_instance_id: model_0
        partition_id: 1
      - model_instance_id: model_0
        partition_id: 2
      - model_instance_id: model_1
        partition_id: 1
      - model_instance_id: model_1
        partition_id: 2
  routes:
    model_0:
      - worker_id: worker1
        partition_id: 0
      - worker_id: worker3
        partition_id: 1
      - worker_id: worker3
        partition_id: 2
    model_1:
      - worker_id: worker2
        partition_id: 0
      - worker_id: worker3
        partition_id: 1
      - worker_id: worker3
        partition_id: 2
  constraints:
    max_first_partitions_per_worker: 1
    later_partitions_worker_id: worker3

output:
  dir: ./results/exp3_memory_aware_multi_model/01_resnet34_3workers_2models_first_split_late_consolidated_cifar100/run_001
