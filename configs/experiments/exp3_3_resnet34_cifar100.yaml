experiment:
  id: exp3_3_resnet34_cifar100
  name: resnet34_memory_aware_multi_model_cross_balanced_placement_cifar100
  description: Two early-exit ResNet-34 model instances with first partitions split and later partitions cross-balanced across all three workers on CIFAR-100.

config_refs:
  dataset: configs/datasets/cifar100.yaml
  model: configs/models/resnet34_ee_entropy_cifar100.yaml
  system: configs/systems/homogeneous_3workers.yaml

runtime:
  batch_size: 1
  warmup_samples: 20
  model_instance_count: 2
  concurrency: 2
  max_samples_per_model: null
  save_per_sample_metrics: true
  save_predictions: false
  placement_strategy: cross_balanced_partition_placement

placement:
  rationale: Keep first partitions on separate workers while distributing second and third partitions across the whole cluster.
  assignments:
    worker1:
      - model_instance_id: model_0
        partition_id: 0
      - model_instance_id: model_1
        partition_id: 1
    worker2:
      - model_instance_id: model_1
        partition_id: 0
      - model_instance_id: model_0
        partition_id: 2
    worker3:
      - model_instance_id: model_0
        partition_id: 1
      - model_instance_id: model_1
        partition_id: 2
  routes:
    model_0:
      - worker_id: worker1
        partition_id: 0
      - worker_id: worker3
        partition_id: 1
      - worker_id: worker2
        partition_id: 2
    model_1:
      - worker_id: worker2
        partition_id: 0
      - worker_id: worker1
        partition_id: 1
      - worker_id: worker3
        partition_id: 2
  constraints:
    max_first_partitions_per_worker: 1

output:
  dir: ./results/exp3_memory_aware_multi_model/03_resnet34_3workers_2models_cross_balanced_cifar100/run_001
